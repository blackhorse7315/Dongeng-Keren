<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Imajinasi - Pembuat Cerita Anak</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Imajinasi">
    
    <!-- App Icons (Generated via SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Cpath d='M30 30h40v40H30z' fill='none'/%3E%3Cpath d='M70 20H30c-5.5 0-10 4.5-10 10v40c0 5.5 4.5 10 10 10h40c5.5 0 10-4.5 10-10V30c0-5.5-4.5-10-10-10zm-5 50H35V30h30v40z' fill='white'/%3E%3Cpath d='M40 40h20v5H40zm0 10h20v5H40zm0 10h10v5H40z' fill='white'/%3E%3Ccircle cx='75' cy='25' r='10' fill='%23fbbf24'/%3E%3Cpath d='M75 18l1 4 4 1-4 1-1 4-1-4-4-1 4-1z' fill='white'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Cpath d='M30 30h40v40H30z' fill='none'/%3E%3Cpath d='M70 20H30c-5.5 0-10 4.5-10 10v40c0 5.5 4.5 10 10 10h40c5.5 0 10-4.5 10-10V30c0-5.5-4.5-10-10-10zm-5 50H35V30h30v40z' fill='white'/%3E%3Cpath d='M40 40h20v5H40zm0 10h20v5H40zm0 10h10v5H40z' fill='white'/%3E%3Ccircle cx='75' cy='25' r='10' fill='%23fbbf24'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        .kids-font {
            font-family: 'Comic Neue', cursive;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .story-image {
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .story-image:hover {
            transform: scale(1.02);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10 flex flex-col items-center">
            <h1 class="text-4xl md:text-6xl font-bold text-indigo-600 kids-font mb-2">✨ Petualangan Imajinasi ✨</h1>
            <p class="text-gray-600 mb-4">Tulis judulmu, biarkan keajaiban terjadi!</p>
            
            <!-- PWA Install Button (Hidden by default) -->
            <button id="btnInstall" class="hidden bg-amber-500 hover:bg-amber-600 text-white px-6 py-2 rounded-full shadow-lg font-bold flex items-center gap-2 transform transition-all active:scale-95">
                <i class="fas fa-download"></i> Pasang Aplikasi di HP
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Side: Controls -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-morphism p-6 rounded-3xl shadow-xl">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">Mulai Cerita Baru</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Judul Cerita</label>
                            <input type="text" id="storyTitle" placeholder="Contoh: Kelinci Terbang ke Bulan" 
                                class="w-full p-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none transition-all">
                        </div>
                        <button id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transform active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-magic"></i> Buat Keajaiban!
                        </button>
                    </div>
                </div>

                <div class="glass-morphism p-6 rounded-3xl shadow-xl max-h-[500px] overflow-y-auto">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center gap-2">
                        <i class="fas fa-book-open text-indigo-500"></i> Perpustakaan Saya
                    </h2>
                    <div id="savedStoriesList" class="space-y-3">
                        <p class="text-gray-400 text-sm italic">Belum ada cerita yang disimpan...</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Display -->
            <div class="lg:col-span-2">
                <div id="displayArea" class="glass-morphism p-6 md:p-10 rounded-3xl shadow-2xl min-h-[600px] flex flex-col items-center justify-center relative">
                    <div id="welcomeMessage" class="text-center space-y-4">
                        <div class="text-8xl">📚</div>
                        <h3 class="text-2xl font-bold text-gray-400">Siap untuk petualangan?</h3>
                        <p class="text-gray-400">Masukkan judul di samping untuk mulai membuat cerita seru.</p>
                    </div>

                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center rounded-3xl">
                        <div class="loader mb-4"></div>
                        <p id="loadingText" class="text-indigo-600 font-semibold">Sedang merangkai kata...</p>
                    </div>

                    <div id="storyContent" class="hidden w-full space-y-6">
                        <div id="imagePlaceholder" class="w-full aspect-video rounded-2xl overflow-hidden bg-gray-100 relative group">
                            <img id="generatedImage" src="" alt="Ilustrasi Cerita" class="w-full h-full object-cover hidden">
                            <div id="imageLoading" class="absolute inset-0 flex items-center justify-center bg-gray-100">
                                <span class="text-gray-400">Menyiapkan ilustrasi...</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between border-b pb-4">
                            <h2 id="finalTitle" class="text-3xl font-bold text-indigo-700 kids-font"></h2>
                            <div class="flex gap-2">
                                <button id="btnPlayAudio" class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-full shadow-md transition-all">
                                    <i class="fas fa-play"></i>
                                </button>
                                <button id="btnSave" class="bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-full shadow-md transition-all">
                                    <i class="fas fa-save"></i>
                                </button>
                            </div>
                        </div>

                        <div id="storyBody" class="text-lg text-gray-700 leading-relaxed space-y-4 whitespace-pre-wrap text-justify">
                            <!-- Story text goes here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        Pesan di sini
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- PWA SETUP ---
        const manifest = {
            "name": "Petualangan Imajinasi Cerita Anak",
            "short_name": "Imajinasi",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4f46e5",
            "icons": [
                {
                    "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Cpath d='M30 30h40v40H30z' fill='none'/%3E%3Cpath d='M70 20H30c-5.5 0-10 4.5-10 10v40c0 5.5 4.5 10 10 10h40c5.5 0 10-4.5 10-10V30c0-5.5-4.5-10-10-10zm-5 50H35V30h30v40z' fill='white'/%3E%3Cpath d='M40 40h20v5H40zm0 10h20v5H40zm0 10h10v5H40z' fill='white'/%3E%3Ccircle cx='75' cy='25' r='10' fill='%23fbbf24'/%3E%3C/svg%3E",
                    "sizes": "192x192",
                    "type": "image/svg+xml",
                    "purpose": "any maskable"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const linkTag = document.createElement('link');
        linkTag.rel = 'manifest';
        linkTag.href = manifestURL;
        document.head.appendChild(linkTag);

        // Handle Install Button
        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.classList.remove('hidden');
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstall.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
        // --- END PWA SETUP ---

        // Configuration
        const apiKey = ""; 
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let currentStoryData = null;
        let audioPlayer = new Audio();

        // Auth Logic
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        }

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                loadSavedStories();
            }
        });

        initAuth();

        // UI Elements
        const btnGenerate = document.getElementById('btnGenerate');
        const btnPlayAudio = document.getElementById('btnPlayAudio');
        const btnSave = document.getElementById('btnSave');
        const inputTitle = document.getElementById('storyTitle');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const storyContent = document.getElementById('storyContent');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const storyBody = document.getElementById('storyBody');
        const finalTitle = document.getElementById('finalTitle');
        const generatedImage = document.getElementById('generatedImage');
        const imageLoading = document.getElementById('imageLoading');
        const savedStoriesList = document.getElementById('savedStoriesList');

        // Functions
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        async function apiCall(url, payload, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) return await response.json();
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
            }
        }

        async function generateStory(title) {
            const prompt = `Buatkan cerita anak yang sangat seru, mendidik, dan penuh imajinasi berdasarkan judul: "${title}". Cerita harus memiliki pengenalan, konflik yang menarik, dan penyelesaian yang bahagia. Gunakan bahasa Indonesia yang ramah anak. Tulis minimal 200 kata. Berikan efek suara dalam teks menggunakan kurung siku seperti [suara angin berdesir] atau [suara tawa ceria] di sela-sela cerita untuk membantu narasi.`;
            
            const result = await apiCall(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                contents: [{ parts: [{ text: prompt }] }]
            });
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        async function generateImage(storyText, title) {
            const imagePrompt = `Whimsical children's book illustration for a story titled "${title}". Style: vibrant, colorful, digital watercolor, 3D animated look, friendly characters. Detail from story: ${storyText.substring(0, 300)}`;
            
            try {
                const result = await apiCall(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    instances: { prompt: imagePrompt },
                    parameters: { sampleCount: 1 }
                });
                return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
            } catch (e) {
                console.error("Image generation failed", e);
                return null;
            }
        }

        async function generateSpeech(text) {
            const ssmlText = `Bacakan dengan nada bercerita yang ceria dan penuh ekspresi: ${text}`;
            
            const result = await apiCall(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                contents: [{ parts: [{ text: ssmlText }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Kore" }
                        }
                    }
                }
            });
            
            const pcmData = result.candidates[0].content.parts[0].inlineData.data;
            return pcmToWav(pcmData, 24000);
        }

        function pcmToWav(base64Pcm, sampleRate) {
            const pcm = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0));
            const wav = new Uint8Array(44 + pcm.length);
            const view = new DataView(wav.buffer);

            view.setUint32(0, 0x52494646, false); 
            view.setUint32(4, 36 + pcm.length, true);
            view.setUint32(8, 0x57415645, false); 

            view.setUint32(12, 0x666d7420, false); 
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);

            view.setUint32(36, 0x64617461, false); 
            view.setUint32(40, pcm.length, true);
            wav.set(pcm, 44);

            return URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
        }

        btnGenerate.onclick = async () => {
            const title = inputTitle.value.trim();
            if (!title) return showToast("Masukkan judul dulu ya!");

            loadingOverlay.classList.remove('hidden');
            welcomeMessage.classList.add('hidden');
            storyContent.classList.add('hidden');
            loadingText.innerText = "Menenun kata-kata ajaib...";

            try {
                const text = await generateStory(title);
                storyBody.innerHTML = text.replace(/\[(.*?)\]/g, '<span class="text-indigo-500 font-bold italic">[$1]</span>');
                finalTitle.innerText = title;
                
                loadingText.innerText = "Melukis imajinasi...";
                
                const imageUrl = await generateImage(text, title);
                if (imageUrl) {
                    generatedImage.src = imageUrl;
                    generatedImage.classList.remove('hidden');
                    imageLoading.classList.add('hidden');
                }

                currentStoryData = {
                    title: title,
                    body: text,
                    image: imageUrl,
                    timestamp: Date.now()
                };

                storyContent.classList.remove('hidden');
            } catch (err) {
                showToast("Duh, ada gangguan sihir. Coba lagi ya!");
                console.error(err);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        };

        btnPlayAudio.onclick = async () => {
            if (!currentStoryData) return;
            
            if (audioPlayer.src && !audioPlayer.paused) {
                audioPlayer.pause();
                btnPlayAudio.innerHTML = '<i class="fas fa-play"></i>';
                return;
            }

            btnPlayAudio.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const audioUrl = await generateSpeech(currentStoryData.body);
                audioPlayer.src = audioUrl;
                audioPlayer.play();
                btnPlayAudio.innerHTML = '<i class="fas fa-pause"></i>';
                
                audioPlayer.onended = () => {
                    btnPlayAudio.innerHTML = '<i class="fas fa-play"></i>';
                };
            } catch (e) {
                showToast("Suaranya lagi hilang, coba lagi nanti!");
                btnPlayAudio.innerHTML = '<i class="fas fa-play"></i>';
            }
        };

        btnSave.onclick = async () => {
            if (!user || !currentStoryData) return;
            btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'stories'), {
                    ...currentStoryData,
                    userId: user.uid
                });
                showToast("Cerita berhasil disimpan ke perpustakaan!");
            } catch (e) {
                showToast("Gagal menyimpan cerita.");
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fas fa-save"></i>';
            }
        };

        function loadSavedStories() {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'stories');
            onSnapshot(q, (snapshot) => {
                savedStoriesList.innerHTML = '';
                if (snapshot.empty) {
                    savedStoriesList.innerHTML = '<p class="text-gray-400 text-sm italic">Belum ada cerita.</p>';
                    return;
                }
                
                const stories = [];
                snapshot.forEach(doc => stories.push({ id: doc.id, ...doc.data() }));
                stories.sort((a, b) => b.timestamp - a.timestamp);

                stories.forEach(story => {
                    const div = document.createElement('div');
                    div.className = "p-3 bg-white/50 hover:bg-white rounded-xl cursor-pointer transition-all border border-transparent hover:border-indigo-200 flex items-center gap-3";
                    div.onclick = () => {
                        currentStoryData = story;
                        finalTitle.innerText = story.title;
                        storyBody.innerHTML = story.body.replace(/\[(.*?)\]/g, '<span class="text-indigo-500 font-bold italic">[$1]</span>');
                        if (story.image) {
                            generatedImage.src = story.image;
                            generatedImage.classList.remove('hidden');
                            imageLoading.classList.add('hidden');
                        } else {
                            generatedImage.classList.add('hidden');
                            imageLoading.classList.remove('hidden');
                        }
                        welcomeMessage.classList.add('hidden');
                        storyContent.classList.remove('hidden');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    
                    div.innerHTML = `
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center text-indigo-500">
                            <i class="fas fa-book"></i>
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <p class="font-semibold text-gray-800 truncate">${story.title}</p>
                            <p class="text-xs text-gray-500">${new Date(story.timestamp).toLocaleDateString()}</p>
                        </div>
                    `;
                    savedStoriesList.appendChild(div);
                });
            }, (error) => console.error("Firestore error:", error));
        }
    </script>
</body>
</html>
